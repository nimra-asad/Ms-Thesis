[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-evidence-load-forecasting"
version = "0.1.0"
description = "Dual-evidence selective residential load forecasting research project"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "lightgbm>=4.5,<5",
  "PyYAML>=6,<7",
  "python-dotenv>=1,<2",
  "requests>=2.32,<3",
  "matplotlib>=3.9,<4",
  "cvxpy>=1.6,<1.8",
]

[project.optional-dependencies]
explain = ["shap>=0.46,<1"]
patchtst = ["torch>=2.2.2,<2.3"]
chronos = ["chronos-forecasting>=2.0,<3", "torch>=2.2.2,<2.3", "transformers>=4.46,<5"]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[project.scripts]
rewdp = "dual_evidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
